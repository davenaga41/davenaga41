<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Davenaga Games</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            margin-top: 50px;
            font-size: 42px;
            font-weight: normal;
        }

        p {
            color: #cccccc;
            font-size: 16px;
            margin-bottom: 35px;
        }

        .games {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .game-button {
            width: 300px;
            padding: 16px;
            background: white;
            color: black;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .game-button:hover {
            background: #dddddd;
        }

        #bouncingImage {
            position: fixed;
            width: 100px;
            height: 100px;
            object-fit: contain;
            pointer-events: none;
        }

        footer {
            position: fixed;
            bottom: 15px;
            width: 100%;
            color: #666666;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <h1>Davenaga Games</h1>

    <p>A small collection of my games.</p>

    <div class="games">

        <button class="game-button" onclick="openGame('game1.html')">
            Game 1
        </button>

        <button class="game-button" onclick="openGame('game2.html')">
            Game 2
        </button>

        <button class="game-button" onclick="openGame('game3.html')">
            Game 3
        </button>

        <button class="game-button" onclick="openGame('game4.html')">
            Game 4
        </button>

        <button class="game-button" onclick="openGame('game5.html')">
            Game 5
        </button>

    </div>

    <!-- Put your image in the same folder as index.html -->
    <img id="bouncingImage" src="image.png" alt="">

    <footer>
        Davenaga Games
    </footer>

    <script>
        function openGame(game) {
            window.location.href = game;
        }

        const image = document.getElementById("bouncingImage");

        let x = 50;
        let y = 200;

        let speedX = 2.5;
        let speedY = 2;

        function moveImage() {
            x += speedX;
            y += speedY;

            const maxX = window.innerWidth - image.offsetWidth;
            const maxY = window.innerHeight - image.offsetHeight;

            if (x <= 0 || x >= maxX) {
                speedX = -speedX;
            }

            if (y <= 0 || y >= maxY) {
                speedY = -speedY;
            }

            image.style.left = x + "px";
            image.style.top = y + "px";

            requestAnimationFrame(moveImage);
        }

        moveImage();
    </script>

</body>
</html>
